version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      # Database connection
      - DATABASE_URL=${DATABASE_URL}
      # Authentication
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Garmin settings
      - GARMIN_TOKEN_DIR=/app/garmin-tokens
      - GARMIN_API_URL=${GARMIN_API_URL}
      - GARMIN_API_KEY=${GARMIN_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - USE_SAMPLE_DATA=${USE_SAMPLE_DATA}
      # OpenAI settings
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Cron job settings
      - CRON_API_KEY=${CRON_API_KEY}
      # Python path in Docker container
      - PYTHON_PATH=/app/venv/bin/python
    volumes:
      # Persist Garmin token files between container restarts
      - garmin-tokens:/app/garmin-tokens

volumes:
  garmin-tokens: 