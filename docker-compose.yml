version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database connection
      - DATABASE_URL=${DATABASE_URL}
      # Authentication
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      # Garmin settings
      - GARMIN_TOKEN_DIR=/app/garmin-tokens
      - GARMIN_API_URL=${GARMIN_API_URL}
      - GARMIN_API_KEY=${GARMIN_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - USE_SAMPLE_DATA=${USE_SAMPLE_DATA}
    volumes:
      # Persist Garmin token files between container restarts
      - garmin-tokens:/app/garmin-tokens

volumes:
  garmin-tokens: 