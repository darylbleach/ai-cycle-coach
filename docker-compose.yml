version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.digitalocean
    environment:
      # These values override anything in the env_file
      - NODE_ENV=production
      - NEXTAUTH_URL=https://ai-cycle-coach-cxvg5.ondigitalocean.app
      # Database connection string (replace with actual value on DigitalOcean)
      - DATABASE_URL=postgresql://username:password@host:port/database?sslmode=require
      # Python path in Docker container
      - PYTHON_PATH=/app/venv/bin/python
      # Garmin settings
      - GARMIN_TOKEN_DIR=/app/garmin-tokens
      # Skip database initialization on startup
      - SKIP_DB_INIT=true
    volumes:
      # Persist Garmin token files between container restarts
      - garmin-tokens:/app/garmin-tokens

volumes:
  garmin-tokens: 